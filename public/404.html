<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found – Vispecta</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0C2A30" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      @font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(/about/fonts/inter-latin-400-normal.woff2) format('woff2'); }
      @font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(/about/fonts/inter-latin-600-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-weight: 700; font-display: swap; src: url(/about/fonts/space-grotesk-latin-700-normal.woff2) format('woff2'); }
      :root {
        --ink: #0C2A30; --ink-2: #11353C; --text: #E6F1F0; --muted: #8FB3B1; --line: #1D4850;
        --accent: #2CC8BC; --accent-ink: #062024; --trace: #F08A24; --axis: #C8372D;
        --font: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --display: 'Space Grotesk', Inter, system-ui, sans-serif;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; font: 17px/1.6 var(--font); color: var(--text); -webkit-font-smoothing: antialiased;
        background: radial-gradient(1200px 600px at 75% -10%, #164A50 0%, transparent 60%), linear-gradient(180deg, var(--ink-2), var(--ink));
        display: flex; flex-direction: column;
      }
      a { color: var(--accent); }
      header, main { width: min(1080px, 100% - 32px); margin: 0 auto; }
      header { display: flex; align-items: center; height: 68px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font: 700 20px var(--display); }
      .mark { width: 30px; height: 30px; }
      .mark-dot { fill: var(--accent); }
      .mark-line { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .beta { font: 600 10px var(--font); letter-spacing: 0.08em; text-transform: uppercase; background: var(--trace); color: #1A0E02; border-radius: 4px; padding: 2px 6px; }
      main { flex: 1; display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; padding: 24px 0 48px; }
      .eyebrow { margin: 0 0 10px; color: var(--accent); font: 600 13px var(--font); letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 0 0 32px; font: 700 clamp(34px, 5vw, 54px)/1.08 var(--display); letter-spacing: -0.01em; color: #fff; }
            .cta { display: flex; flex-wrap: wrap; gap: 12px; }
      .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 10px; font-weight: 600; text-decoration: none; }
      .btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 30px -10px rgba(44, 200, 188, 0.6); }
      .btn.ghost { color: #fff; border: 1px solid rgba(255, 255, 255, 0.22); }
      .btn:hover { filter: brightness(1.08); }
      .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      figure { margin: 0; }
      .art { width: 100%; height: auto; display: block; }
      .art text { font-family: var(--display); }
      @media (max-width: 760px) {
        main { grid-template-columns: 1fr; gap: 28px; padding-top: 8px; align-content: start; }
        figure { order: -1; max-width: 420px; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/?app" aria-label="Vispecta">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle class="mark-dot" cx="32" cy="14" r="6"/><path class="mark-line" d="M6 30H19L28 48H36L45 30H58"/></svg>
        <span>Vispecta</span><span class="beta">Beta</span>
      </a>
    </header>

    <main>
      <div>
        <p class="eyebrow">404</p>
        <h1 data-t="title">Station 0+404 is not on the alignment.</h1>
        <div class="cta">
          <a class="btn primary" href="/?app"><span data-t="open">Open Vispecta</span> <span aria-hidden="true">→</span></a>
          <a class="btn ghost" href="/about/" data-t="about">About Vispecta</a>
        </div>
      </div>
      <figure aria-hidden="true">
        <!-- the alignment with km posts, and station 0+404 off the line -->
        <svg class="art" viewBox="0 0 480 340">
          <rect x="0" y="0" width="480" height="340" rx="18" fill="#0A2328"/>
          <path d="M-10 290 C 120 280, 200 220, 260 150 S 380 40, 500 30" fill="none" stroke="#2CC8BC" stroke-width="3"/>
          <g fill="#8FB3B1" font-size="13">
            <circle cx="109" cy="263" r="4.5" fill="#2CC8BC"/><text x="120" y="285">0+100</text>
            <circle cx="221" cy="190" r="4.5" fill="#2CC8BC"/><text x="232" y="207">0+200</text>
            <circle cx="306" cy="103" r="4.5" fill="#2CC8BC"/><text x="318" y="122">0+300</text>
          </g>
          <path d="M392 52 L 412 150" stroke="#F08A24" stroke-width="2" stroke-dasharray="6 6"/>
          <circle cx="414" cy="166" r="9" fill="#F08A24"/>
          <text x="414" y="204" text-anchor="middle" font-size="18" font-weight="700" fill="#F08A24">0+404</text>
        </svg>
      </figure>
    </main>

    <script>
      (function () {
        var T = {
          da: { title: 'Station 0+404 ligger ikke på linjeføringen.', open: 'Åbn Vispecta', about: 'Om Vispecta', doc: 'Siden findes ikke – Vispecta' },
          de: { title: 'Station 0+404 liegt nicht auf der Achse.', open: 'Vispecta öffnen', about: 'Über Vispecta', doc: 'Seite nicht gefunden – Vispecta' }
        };
        var lang = '';
        try { lang = localStorage.getItem('onlineifc.lang') || ''; } catch (e) { /* ignore */ }
        if (!T[lang]) lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
        var d = T[lang];
        if (d) {
          document.documentElement.lang = lang;
          document.title = d.doc;
          var els = document.querySelectorAll('[data-t]');
          for (var i = 0; i < els.length; i++) { var k = els[i].getAttribute('data-t'); if (d[k]) els[i].textContent = d[k]; }
        }
      })();
    </script>
  </body>
</html>
