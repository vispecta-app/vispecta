name: CI

# Lint, build and a smoke test in headless Chromium on every pull request (#57).
# Make "CI / smoke" a required check for main (Settings → Branches or Rulesets), so nothing is merged
# – and deployed by deploy.yml – before it passes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build reads the version from the latest release tag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build:app
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: npm run test:smoke
